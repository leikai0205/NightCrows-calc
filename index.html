<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦅 夜鴉 (NIGHT CROWS) 交易所計算器</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --card-bg: #161d2a;
            --card-border: #232f45;
            --accent-glow: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #f87171;
            --success: #4ade80;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-glow);
            margin: 0;
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: #e2e8f0;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-card {
            background: rgba(11, 16, 23, 0.6);
            border: 1px solid #1e293b;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .step-header {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-glow);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #2d3b54;
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .select-container {
            display: flex;
            align-items: center;
            background-color: #0b1017;
            border: 1px solid #2d3b54;
            border-radius: 8px;
            padding: 4px 10px;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .select-container:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .selected-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }

        select, input {
            background-color: #0b1017;
            border: 1px solid #2d3b54;
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }

        .select-container select {
            background-color: transparent;
            border: none;
            padding: 8px 4px;
        }

        select option {
            background-color: #161d2a;
            color: #f1f5f9;
            padding: 10px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-glow);
        }

        .fee-hint {
            font-size: 0.75rem;
            color: #38bdf8;
            margin-top: 2px;
        }

        .result-box {
            background: linear-gradient(135deg, #1b263b 0%, #111827 100%);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .result-item span:last-child {
            font-weight: 600;
        }

        .status-badge {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .status-profit {
            background-color: rgba(74, 222, 128, 0.15);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .status-loss {
            background-color: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .params-section {
            opacity: 0.85;
        }
        
        .params-section:hover {
            opacity: 1;
        }
    </style>
</head>

<script>
    const iconMap = {
        "MORION": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-morion.webp",
        "TEAR": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-tear.webp",
        "ESSENCE": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-essence.webp",
        "PAPYRUS": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-papyrus.webp",
        "ALLOY": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-alloy.webp",
        "FEATHER": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-feather.webp",
        "PROMOTE": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-promote.webp",
        "GEAR": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-gear.webp",
        "RAVN": "https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-ravn.webp",
        "CUSTOM": ""
    };

    function updateStepIcon(step) {
        const select = document.getElementById(`s${step}-item`);
        const icon = document.getElementById(`s${step}-icon`);
        const val = select.value;
        if (iconMap[val]) {
            icon.src = iconMap[val];
            icon.style.display = 'block';
        } else {
            icon.style.display = 'none';
        }
    }

    function calculate() {
        const takerFee = parseFloat(document.getElementById('taker-fee').value) || 0.06;
        const makerFee = parseFloat(document.getElementById('maker-fee').value) || 0.04;
        const marketFee = parseFloat(document.getElementById('market-fee').value) || 0.05;

        // 模擬 6 步驟流水計算
        // 步驟 1 買進
        const s1Price = parseFloat(document.getElementById('s1-price').value) || 0;
        const s1Qty = parseFloat(document.getElementById('s1-qty').value) || 0;
        const s1Market = document.getElementById('s1-market').value;
        const s1FeeRate = (s1Market === 'PNIX') ? takerFee : marketFee;
        const totalCostCrow = s1Price * s1Qty * (1 + s1FeeRate);

        // 步驟 2 轉換
        const s2Ratio = parseFloat(document.getElementById('s2-price').value) || 1;
        const s2Fee = parseFloat(document.getElementById('s2-fee').value) || 0;
        let currentAmount = s2Ratio > 0 ? s1Qty / s2Ratio - s2Fee : s1Qty;

        // 步驟 3 販售
        const s3Price = parseFloat(document.getElementById('s3-price').value) || 0;
        const s3Market = document.getElementById('s3-market').value;
        const s3FeeRate = (s3Market === 'PNIX') ? makerFee : marketFee;
        let currentDiamonds = currentAmount * s3Price * (1 - s3FeeRate);

        // 步驟 4 購買第二樣
        const s4Price = parseFloat(document.getElementById('s4-price').value) || 1;
        let secondItemQty = s4Price > 0 ? currentDiamonds / s4Price : 0;

        // 步驟 5 再次轉換
        const s5Ratio = parseFloat(document.getElementById('s5-price').value) || 1;
        const s5Fee = parseFloat(document.getElementById('s5-fee').value) || 0;
        let finalTokens = s5Ratio > 0 ? secondItemQty / s5Ratio - s5Fee : secondItemQty;

        // 步驟 6 PNIX 售出
        const s6Price = parseFloat(document.getElementById('s6-price').value) || 0;
        const getCrow = finalTokens * s6Price * (1 - makerFee);
        const profitCrow = getCrow - totalCostCrow;

        // 畫面更新
        document.getElementById('res-cost-crow').innerText = totalCostCrow.toFixed(3) + ' CROW';
        document.getElementById('res-token-qty').innerText = finalTokens.toFixed(2) + ' 個';
        document.getElementById('res-get-crow').innerText = getCrow.toFixed(3) + ' CROW';

        const statusBadge = document.getElementById('res-status');
        if (profitCrow >= 0) {
            statusBadge.className = 'status-badge status-profit';
            statusBadge.innerHTML = `🟢 賺 ${profitCrow.toFixed(3)} CROW (有賺錢)`;
        } else {
            statusBadge.className = 'status-badge status-loss';
            statusBadge.innerHTML = `🔴 賠 ${Math.abs(profitCrow).toFixed(3)} CROW (會虧錢)`;
        }
    }

    // 初始化執行
    for(let i=1; i<=6; i++) {
        updateStepIcon(i);
    }
    calculate();
</script>

</body>
</html>
