<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜鴉 (NIGHT CROWS) 交易所</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --card-bg: #161d2a;
            --card-border: #232f45;
            --accent-glow: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #f87171;
            --success: #4ade80;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-glow);
            margin: 0;
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: #e2e8f0;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select, input {
            background-color: #0b1017;
            border: 1px solid #2d3b54;
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .result-box {
            background: linear-gradient(135deg, #1b263b 0%, #111827 100%);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .result-item span:last-child {
            font-weight: 600;
        }

        .status-badge {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            background-color: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .params-section {
            opacity: 0.85;
        }
        
        .params-section:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🦅 夜鴉 (NIGHT CROWS) 交易所</h1>
    </header>

    <!-- 2️⃣ 選擇商品與價格輸入（移至上方並拆分買賣） -->
    <div class="card">
        <h2>📦 商品選擇與價格設定</h2>
        
        <div class="form-row">
            <div class="form-group">
                <label for="buy-item">🛒 購買商品 (PNIX 端)</label>
                <select id="buy-item">
                    <option value="MORION">MORION 墨水晶 (10顆 = 1幣)</option>
                    <option value="TEAR" selected>TEAR 冰凍之淚</option>
                    <option value="ESSENCE">ESSENCE 詛咒精華</option>
                    <option value="PAPYRUS">PAPYRUS 古代沙草紙</option>
                    <option value="ALLOY">ALLOY 古代匠人的合金</option>
                    <option value="FEATHER">FEATHER 蒼天碎片</option>
                    <option value="PROMOTE">PROMOTE 優級轉職信物</option>
                    <option value="GEAR">GEAR 超精密飛行零件</option>
                    <option value="RAVN">RAVN RAVIUM</option>
                    <option value="CUSTOM">其他（自訂商品）</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="sell-item">💰 販售商品 (世界交易所端)</label>
                <select id="sell-item">
                    <option value="MORION" selected>MORION 墨水晶 (10顆 = 1幣)</option>
                    <option value="TEAR">TEAR 冰凍之淚</option>
                    <option value="ESSENCE">ESSENCE 詛咒精華</option>
                    <option value="PAPYRUS">PAPYRUS 古代沙草紙</option>
                    <option value="ALLOY">ALLOY 古代匠人的合金</option>
                    <option value="FEATHER">FEATHER 蒼天碎片</option>
                    <option value="PROMOTE">PROMOTE 優級轉職信物</option>
                    <option value="GEAR">GEAR 超精密飛行零件</option>
                    <option value="RAVN">RAVN RAVIUM</option>
                    <option value="CUSTOM">其他（自訂商品）</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="pnix-buy-price">PNIX 買進價 (CROW)</label>
                <input type="number" id="pnix-buy-price" value="0.04" step="0.001">
            </div>
            <div class="form-group">
                <label for="buy-qty">購買數量 (PNIX 端)</label>
                <input type="number" id="buy-qty" value="111">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="market-sell-price">世界交易所賣出價 (鑽石)</label>
                <input type="number" id="market-sell-price" value="9.0" step="0.1">
            </div>
            <div class="form-group">
                <label for="game-buy-price">遊戲內買進價 / 回收價 (鑽石)</label>
                <input type="number" id="game-buy-price" value="1.57" step="0.01">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="game-fixed-fee">遊戲內鑄造/上架固定扣鑽 (每幣)</label>
                <input type="number" id="game-fixed-fee" value="1">
            </div>
            <div class="form-group">
                <label for="pnix-sell-price">PNIX 賣出價 (CROW)</label>
                <input type="number" id="pnix-sell-price" value="0.11" step="0.001">
            </div>
        </div>
    </div>

    <!-- 3️⃣ 計算結果 -->
    <div class="card result-box">
        <h2>📊 計算結果分析</h2>
        <div class="result-item">
            <span>實際花費 CROW (含買進手續費)：</span>
            <span>4.706 CROW</span>
        </div>
        <div class="result-item">
            <span>遊戲換回的代幣數量 (已扣固定鑄造費)：</span>
            <span>0.51 個</span>
        </div>
        <div class="result-item">
            <span>賣回 PNIX 實得 CROW (含賣出手續費)：</span>
            <span>0.054 CROW</span>
        </div>
        
        <div class="status-badge">
            🔴 賠 4.653 CROW (會虧錢)
        </div>
    </div>

    <!-- 1️⃣ 基礎參數設定（移至最下方，平時不需動） -->
    <div class="card params-section">
        <h2>⚙️ 基礎參數設定 (長期固定)</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="taker-fee">PNIX 買進手續費 (吃單 Taker)</label>
                <input type="number" id="taker-fee" value="0.06" step="0.01">
            </div>
            <div class="form-group">
                <label for="maker-fee">PNIX 賣出手續費 (掛單 Maker)</label>
                <input type="number" id="maker-fee" value="0.04" step="0.01">
            </div>
        </div>
        <div class="form-group">
            <label for="market-fee">遊戲內交易所手續費</label>
            <input type="number" id="market-fee" value="0.05" step="0.01">
        </div>
    </div>

</div>

</body>
</html>
