<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦅 夜鴉 (NIGHT CROWS) 交易所計算器</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --card-bg: #161d2a;
            --card-border: #232f45;
            --accent-glow: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #f87171;
            --success: #4ade80;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-glow);
            margin: 0;
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: #e2e8f0;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .market-side {
            background: rgba(11, 16, 23, 0.5);
            border: 1px solid #1e293b;
            padding: 14px;
            border-radius: 10px;
        }

        .market-side h3 {
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--accent-glow);
            border-bottom: 1px dashed #2d3b54;
            padding-bottom: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .select-container {
            display: flex;
            align-items: center;
            background-color: #0b1017;
            border: 1px solid #2d3b54;
            border-radius: 8px;
            padding: 4px 10px;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .select-container:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .selected-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }

        select, input {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            padding: 8px 4px;
            font-size: 0.95rem;
            width: 100%;
        }

        select option {
            background-color: #161d2a;
            color: #f1f5f9;
            padding: 10px;
        }

        input {
            background-color: #0b1017;
            border: 1px solid #2d3b54;
            border-radius: 8px;
            padding: 10px 12px;
        }

        select:focus, input:focus {
            outline: none;
        }

        .fee-hint {
            font-size: 0.75rem;
            color: #38bdf8;
            margin-top: 2px;
        }

        .result-box {
            background: linear-gradient(135deg, #1b263b 0%, #111827 100%);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .result-item span:last-child {
            font-weight: 600;
        }

        .status-badge {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .status-profit {
            background-color: rgba(74, 222, 128, 0.15);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .status-loss {
            background-color: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .params-section {
            opacity: 0.85;
        }
        
        .params-section:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🦅 夜鴉 (NIGHT CROWS) 交易所計算器</h1>
    </header>

    <!-- 跨市場套利設定（左右分欄：買進 vs 販售） -->
    <div class="card">
        <h2>📦 跨市場套利與轉換設定</h2>
        
        <div class="form-row">
            <!-- 左側：購買端設定 -->
            <div class="market-side">
                <h3>🛒 購買端設定</h3>
                
                <div class="form-group">
                    <label for="buy-action">1. 動作選擇</label>
                    <select id="buy-action" onchange="calculate()">
                        <option value="BUY" selected>🛒 購買 (Buy)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="buy-market">2. 選擇平台</label>
                    <select id="buy-market" onchange="onPlatformChange('buy')">
                        <option value="PNIX" selected>PNIX 端 (自動套用 Taker 手續費)</option>
                        <option value="MARKET">遊戲內交易所 (固定 5% 手續費)</option>
                    </select>
                    <div id="buy-fee-hint" class="fee-hint">⚙️ 自動套用 PNIX 買進手續費 (Taker)</div>
                </div>

                <div class="form-group">
                    <label for="buy-item">3. 選擇商品</label>
                    <div class="select-container">
                        <img id="buy-icon" class="selected-icon" src="https://gcdn.wemade.games/prod/ncgl/official/2.8.6/_next/static/images/home/token-tear.webp" alt="icon">
                        <select id="buy-item" onchange="updateIcon('buy')">
                            <option value="MORION">MORION 墨水晶</option>
                            <option value="TEAR" selected>TEAR 冰凍之淚</option>
                            <option value="ESSENCE">ESSENCE 詛咒精華</option>
                            <option value="PAPYRUS">PAPYRUS 古代沙草紙</option>
                            <option value="ALLOY">ALLOY 古代匠人的合金</option>
                            <option value="FEATHER">FEATHER 蒼天碎片</option>
                            <option value="PROMOTE">PROMOTE 優級轉職信物</option>
                            <option value="GEAR">GEAR 超精密飛行零件</option>
                            <option value="RAVN">RAVN RAVIUM</option>
                            <option value="CUSTOM">其他（自訂商品）</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="buy-price">買進單價 (CROW / 鑽石)</label>
                    <input type="number" id="buy-price" value="0.04" step="0.001" oninput="calculate()">
                </div>

                <div class="form-group">
                    <label for="buy-qty">購買數量</label>
                    <input type="number" id="buy-qty" value="111" oninput="calculate()">
                </div>
            </div>

            <!-- 右側：販售端設定（含轉換動作） -->
            <div class="market-side">
                <h3>💰 販售 / 轉換端設定</h3>
                
                <div class="form-group">
                    <label for="sell-action">1. 動作選擇</label>
                    <select id="sell-action" onchange="calculate()">
                        <option value="SELL">💰 販售 (Sell)</option>
                        <option value="CONVERT" selected>🔄 轉換成代幣後再販售 (Convert)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sell-market">2. 選擇平台</label>
                    <select
